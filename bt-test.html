<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>프린터 찾기 시험</title>
<style>
/* 1회성 시험 페이지(2026-11-20): PeriPage A6(11-23 효니 확인, 처음엔 C1로 앎)이 크롬 블루투스(Web Bluetooth)로 보이는지, 어떤 통로(서비스·특성)가 있는지 본다. 결과로 «바로 인쇄»를 만들 수 있는지 정하고, 끝나면 지운다. */
:root{--space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--bg:#f5f6f8;--card:#fff;--text:#212529;--sub:#6c757d;--accent:#5b5bd6;--bad:#d6336c;--ok:#2b8a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:16px}
.wrap{max-width:40rem;margin:0 auto;padding:var(--space-3)}
.card{background:var(--card);border-radius:14px;padding:var(--space-3);margin-bottom:var(--space-3);box-shadow:0 1px 4px #0001}
h1{font-size:20px;margin:0 0 var(--space-2)}
ol{margin:0;padding-left:20px;line-height:1.7}
button{display:block;width:100%;height:48px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:var(--space-2)}
button.sub{background:#fff;color:var(--text);border:1px solid #ccc}
pre{white-space:pre-wrap;word-break:break-all;font-size:13px;background:#f1f3f5;border-radius:8px;padding:var(--space-2);margin:var(--space-2) 0 0;min-height:48px}
.st{font-weight:700;margin-top:var(--space-2)}
.st.bad{color:var(--bad)}.st.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <h1>🖨️ 프린터 찾기 시험</h1>
    <ol>
      <li><b>디벗(갤럭시) 크롬</b>에서 열어요. 아이폰은 브라우저 블루투스가 막혀 있어 안 돼요.</li>
      <li>PeriPage 앱을 완전히 끄고, A6을 켜 둬요(앱이 붙잡고 있으면 안 보여요).</li>
      <li>먼저 아래 «시험 인쇄»를 눌러 목록에서 A6(또는 PeriPage)을 골라요. 종이가 나오면 끝! 계산대 «🖨️ 바로 인쇄»도 돼요.</li>
      <li>안 나오면 «프린터 찾기»를 눌러 결과를 «복사»해서 Claude에게 보내 주세요. 화면을 찍어도 돼요.</li>
    </ol>
    <button type="button" id="tp">🖨️ 시험 인쇄</button>
    <button type="button" class="sub" id="go">프린터 찾기(안 될 때)</button>
    <button type="button" class="sub" id="tps">직렬로 시험(목록에 프린터가 안 뜰 때)</button>
    <button type="button" class="sub" id="chs">통로마다 시험(보냈는데 종이가 안 나올 때)</button>
    <div id="chl"></div>
    <label style="display:block;margin-top:8px"><input type="checkbox" id="allDev"> 목록에 모든 기기 보기(프린터가 안 뜰 때만)</label>
    <p class="st" id="st" role="status"></p>
  </section>
  <section class="card">
    <b>결과</b>
    <pre id="out">아직 없어요.</pre>
    <button type="button" class="sub" id="copy">결과 복사</button>
  </section>
</div>
<script src="a6print.js?v=69"></script>
<script>
// 감열 프린터들이 흔히 쓰는 서비스 번호. Web Bluetooth는 여기 적은 서비스만 열어 볼 수 있다.
const SV=[0xff00,0xffe0,0xfff0,0xae30,0xae00,0x18f0,0xfee7,0xff80,0xffb0,0x49535343,
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb',
  '000018f0-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb','6e400001-b5a3-f393-e0a9-e50e24dcca9e']
  .map(x=>typeof x==='number'?(x>0xffff?null:x):x).filter(x=>x!=null);
const out=document.getElementById('out'),st=document.getElementById('st');
const log=[];const add=t=>{log.push(t);out.textContent=log.join('\n')};
const say=(t,c)=>{st.textContent=t;st.className='st '+(c||'')};
function props(p){return ['read','write','writeWithoutResponse','notify','indicate'].filter(k=>p[k]).join(',')}
document.getElementById('go').onclick=async()=>{
  log.length=0;add('브라우저: '+navigator.userAgent);
  if(!navigator.bluetooth){say('이 브라우저는 블루투스 연결을 못 해요. 디벗 크롬에서 열어 주세요.','bad');add('navigator.bluetooth 없음');return}
  try{
    say('목록에서 프린터를 골라 주세요…');
    const dev=await A6Print.pick({fresh:true,all:document.getElementById('allDev').checked});
    add('기기 이름: '+(dev.name||'(이름 없음)')+' / id: '+dev.id);
    say('연결하는 중…');
    const g=await dev.gatt.connect();
    const ss=await g.getPrimaryServices();
    add('서비스 '+ss.length+'개');
    for(const s of ss){
      add('■ '+s.uuid);
      try{for(const c of await s.getCharacteristics())add('   - '+c.uuid+'  ['+props(c.properties)+']')}catch(e){add('   (특성 못 읽음: '+e.message+')')}
    }
    g.disconnect();
    say(ss.length?'찾았어요! 결과를 복사해서 보내 주세요.':'연결은 됐는데 아는 통로가 없어요. 결과를 보내 주세요.',ss.length?'ok':'bad');
  }catch(e){
    add('오류: '+e.name+' / '+e.message);
    say(e.name==='NotFoundError'?'목록에 안 보였거나 취소했어요. 앱을 끄고 다시 해 주세요.':'연결하지 못했어요. 결과를 보내 주세요.','bad');
  }
};
const testPrint=async via=>{
  log.length=0;add('브라우저: '+navigator.userAgent+' / 통로: '+(via||'ble'));
  if(!window.A6Print||!A6Print.supported){say('이 브라우저는 프린터에 바로 연결할 수 없어요. 디벗 크롬에서 열어 주세요.','bad');return}
  if(via==='serial'&&!navigator.serial){say('이 크롬은 직렬 연결을 못 해요. «프린터 찾기» 결과를 보내 주세요.','bad');add('navigator.serial 없음');return}
  const cv=document.createElement('canvas');cv.width=384;cv.height=200;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,384,200);x.fillStyle='#000';x.textAlign='center';x.textBaseline='top';
  x.font='700 30px sans-serif';x.fillText('프린터 시험 인쇄',192,20);x.font='400 20px sans-serif';x.fillText('대영중 학생회 상점 교환소',192,70);
  x.fillText(new Date().toLocaleString('ko-KR'),192,104);for(let i=0;i<24;i++)x.fillRect(16+i*15,150,i%3?4:8,36);
  try{say('목록에서 프린터를 골라 주세요…');const how=await A6Print.print(cv,{via});add('보냄: '+JSON.stringify(A6Print.info()));say(how==='ble'?'보냈어요! 종이가 나왔나 봐 주세요.':'보냈어요(직렬 연결). 종이가 나왔나 봐 주세요.','ok')}
  catch(e){add('오류: '+e.name+' / '+e.message);say('시험 인쇄가 안 됐어요. «프린터 찾기»도 눌러 결과를 보내 주세요.','bad')}
};
document.getElementById('tp').onclick=()=>testPrint();
document.getElementById('tps').onclick=()=>testPrint('serial');
// 통로마다 시험(2026-11-23): A6(PPG_A6_..._BLE)은 쓰기 통로가 4개라 어느 것이 인쇄 통로인지 종이로 가린다.
// 한 번 연결해 두고 통로별로 «그림»(지금 계산대 방식)·«글자»(ESC/POS 글자) 두 가지를 보낸다. 종이에 통로 번호가 찍힌다.
let chDev=null;
const chSleep=ms=>new Promise(r=>setTimeout(r,ms));
async function chSend(c,bytes){
  for(let i=0;i<bytes.length;i+=20){const p=bytes.subarray(i,i+20);
    c.properties.writeWithoutResponse?await c.writeValueWithoutResponse(p):await c.writeValueWithResponse(p);await chSleep(8)}
}
function chPic(n){const cv=document.createElement('canvas');cv.width=384;cv.height=140;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,384,140);x.fillStyle='#000';x.textAlign='center';x.textBaseline='top';
  x.font='700 40px sans-serif';x.fillText('통로 '+n+' 그림',192,16);for(let i=0;i<24;i++)x.fillRect(16+i*15,90,i%3?4:8,36);return cv}
function chText(n){const t='CH '+n+' TEXT OK\n\n\n\n';return Uint8Array.from([0x1b,0x40,...Array.from(t,ch=>ch.charCodeAt(0))])}
document.getElementById('chs').onclick=async()=>{
  log.length=0;add('브라우저: '+navigator.userAgent+' / 통로마다 시험');
  const box=document.getElementById('chl');box.textContent='';
  if(!navigator.bluetooth){say('이 브라우저는 블루투스 연결을 못 해요.','bad');return}
  try{
    say('목록에서 PPG_A6_..._BLE 를 골라 주세요…');
    chDev=await A6Print.pick({all:document.getElementById('allDev').checked});
    addEventListener('pagehide',()=>{try{chDev&&chDev.gatt.connected&&chDev.gatt.disconnect()}catch(e){}});
    add('기기 이름: '+(chDev.name||'(이름 없음)'));
    say('연결하는 중…');
    const g=await chDev.gatt.connect();const cs=[];
    for(const sv of await g.getPrimaryServices()){let l=[];try{l=await sv.getCharacteristics()}catch(e){}
      for(const c of l)if(c.properties.write||c.properties.writeWithoutResponse)cs.push(c)}
    if(!cs.length){say('쓸 수 있는 통로가 없어요. 결과를 보내 주세요.','bad');return}
    cs.forEach((c,i)=>{const n=i+1;add('통로 '+n+': '+c.service.uuid.slice(0,8)+' / '+c.uuid.slice(0,8));
      const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;margin-top:8px';
      for(const kind of ['그림','글자']){const b=document.createElement('button');b.type='button';b.className='sub';
        b.textContent='통로 '+n+' '+kind+' ('+c.uuid.slice(4,8)+')';
        b.onclick=async()=>{if(b.disabled)return;b.disabled=true;
          try{if(!chDev.gatt.connected)await chDev.gatt.connect();say('통로 '+n+' '+kind+' 보내는 중…');
            await chSend(c,kind==='그림'?A6Print.job(chPic(n)):chText(n));add('보냄: 통로 '+n+' '+kind);say('통로 '+n+' '+kind+' 보냈어요. 종이가 나왔나 봐 주세요.','ok')}
          catch(e){add('오류(통로 '+n+' '+kind+'): '+e.name+' / '+e.message);say('통로 '+n+' 보내기 실패 — 다음 통로를 눌러 보세요.','bad')}
          finally{b.disabled=false}};
        row.appendChild(b)}
      box.appendChild(row)});
    say('연결됐어요. 아래 단추를 위에서부터 하나씩 눌러 보고, 종이가 나온 단추를 알려 주세요.','ok');
  }catch(e){add('오류: '+e.name+' / '+e.message);say(e.name==='NotFoundError'?'목록에서 고르지 않았거나 취소했어요.':'연결하지 못했어요. 결과를 보내 주세요.','bad')}
};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(out.textContent).then(()=>say('복사했어요','ok'),()=>say('복사하지 못했어요. 화면을 찍어 주세요.','bad'));
</script>
</body>
</html>
