<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2027 학생회 임원 신청</title>
<link rel="icon" href="icon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 학생회 앱(index.html·sangjeom.html)과 같은 색. 학생은 폰 세로로 쓸 가능성이 높아 칸·버튼을 크게 둔다 */
:root{
  /* 간격 눈금 8pt (위키 도구/ui-간격-8pt-규칙.md, 2026-11-12) */
  --space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--space-5:32px;--space-6:48px;--space-7:64px;
  --bg:#f8f9fa;--surface:#fff;--surface2:#f1f3f5;--border:#dee2e6;
  --accent:#5b52e8;--accent-soft:#eeedfd;--good:#1b7a36;--good-soft:#e6f6ea;--bad:#c02b2b;--bad-soft:#fdecec;--warn:#8a5a00;--warn-soft:#fff4dc;
  --text:#212529;--text2:#495057;--text3:#6c757d;--sh:0 2px 10px rgba(30,30,60,.07);
}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;word-break:keep-all;min-height:100vh}
.wrap{width:100%;max-width:36rem;margin:0 auto;padding:var(--space-3) var(--space-3) var(--space-7)}
.wrap.wide{max-width:72rem}
@media (min-width:768px){.wrap{padding-top:var(--space-4)}body{font-size:17px}}
h1{font-size:22px;font-weight:900;line-height:1.35}
h2{font-size:17px;font-weight:700}
.sub{color:var(--text2);font-size:14px}
.muted{color:var(--text3);font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:var(--space-3);box-shadow:var(--sh);margin-bottom:var(--space-3)}
@media (min-width:768px){.card{padding:var(--space-4)}}
.card>h2{margin-bottom:var(--space-2)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:var(--space-2) var(--space-3);font-size:14px;margin-bottom:var(--space-3)}
.steps{list-style:none;padding:0;display:grid;gap:var(--space-2)}
.steps li{display:flex;gap:var(--space-2);font-size:15px}
.steps b{flex:none;min-width:5.5em;color:var(--accent)}
.depts{display:grid;gap:var(--space-2)}
@media (min-width:600px){.depts{grid-template-columns:1fr 1fr}}
.dept{background:var(--surface2);border-radius:10px;padding:var(--space-2) var(--space-3)}
.dept b{display:block}
.dept span{font-size:14px;color:var(--text2)}

/* ── 폼 ── */
.field{margin-top:var(--space-4);border:0;padding:0;min-width:0}
.field:first-child{margin-top:0}
.field>label,.field>legend{display:block;font-size:15px;font-weight:700;color:var(--text);margin-bottom:var(--space-2);padding:0}
.field .hint{display:block;font-size:13px;font-weight:400;color:var(--text3);margin-top:calc(-1*var(--space-1));margin-bottom:var(--space-2)}
.req{color:var(--bad);margin-left:2px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;font:inherit;font-size:17px;border:1px solid var(--border);border-radius:10px;padding:0 var(--space-3);background:#fff;color:var(--text)}
input[type=text],input[type=password],input[type=search],select{height:48px}
select{padding-right:var(--space-5)}
/* 글이 길어지면 칸이 따라 커진다(field-sizing은 새 기능이라 안 되는 기기는 고정 높이+스크롤로 그대로 쓴다) */
textarea{padding:var(--space-2) var(--space-3);min-block-size:6.5em;line-height:1.6;resize:vertical;field-sizing:content;max-block-size:24em}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,82,232,.18)}
.pin{max-width:12rem;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.count{display:block;text-align:right;font-size:12px;color:var(--text3);margin-top:var(--space-1)}
.choices{display:grid;gap:var(--space-2)}
.choices.inline{grid-template-columns:repeat(auto-fit,minmax(7rem,1fr))}
.choice{display:flex;align-items:flex-start;gap:var(--space-2);min-height:48px;padding:var(--space-2) var(--space-3);border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:16px}
.field>label.choice{display:flex;font-weight:500;margin-bottom:0}
.choice input{flex:none;width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.choice small{display:block;color:var(--text3);font-size:13px}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice:has(input:focus-visible){outline:3px solid rgba(91,82,232,.35);outline-offset:1px}
.two{display:grid;gap:var(--space-3)}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}.two .field{margin-top:0}}
.section-title{margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--border)}
.note{font-size:14px;color:var(--text2);background:var(--surface2);border-radius:10px;padding:var(--space-2) var(--space-3);margin-top:var(--space-2)}

/* 오류: 손댄 뒤나 «내기»를 누른 뒤에만 보인다(:user-invalid). 색만이 아니라 아이콘+글로도 알린다 */
.err{display:none;color:var(--bad);font-size:14px;margin-top:var(--space-1)}
:is(input,select,textarea):is(:user-invalid,.ui-fb){border-color:var(--bad);background:var(--bad-soft)}
.field:has(:user-invalid) .err,.field.inv .err{display:block}
.field:has(:user-invalid) .choice,.field.inv .choice{border-color:var(--bad)}
.visually-hidden:where(:not(:focus-within,:active)){position:absolute!important;clip-path:inset(50%)!important;overflow:hidden!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;border:0!important;white-space:nowrap!important}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:48px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;padding:0 var(--space-4);text-decoration:none}
.btn.block{display:flex;width:100%}
.btn.line{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:40px;font-size:15px;padding:0 var(--space-3)}
.btn.xs{min-height:32px;font-size:14px;padding:0 var(--space-2);border-radius:8px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tile:focus-visible,.num:focus-visible{outline:3px solid rgba(91,82,232,.45);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.row .btn{flex:1}
.link{color:var(--text3);font-size:14px;background:none;border:0;cursor:pointer;font-family:inherit;text-decoration:underline;padding:var(--space-1) 2px}
/* 늘 보여야 하는 «내기» 버튼은 아래에 붙인다(움직임 표 «Sticky», 화면 높이 15% 이하) */
.submitbar{position:sticky;bottom:0;margin:var(--space-4) calc(-1*var(--space-3)) 0;padding:var(--space-2) var(--space-3) calc(var(--space-2) + env(safe-area-inset-bottom));background:rgba(248,249,250,.94);border-top:1px solid var(--border);z-index:5}
@supports (backdrop-filter:blur(4px)){.submitbar{backdrop-filter:blur(6px)}}

/* ── 대화상자(앱 안 확인 창) ── */
dialog{margin:auto;border:0;border-radius:16px;padding:0;width:min(32rem,calc(100% - 2*var(--space-3)));max-height:calc(100% - 2*var(--space-5));box-shadow:0 10px 40px rgba(20,20,50,.25);color:var(--text)}
dialog:modal{overscroll-behavior:contain}
dialog::backdrop{background:rgba(20,20,40,.45);overflow:hidden;overscroll-behavior:contain}
dialog .dbody{padding:var(--space-4) var(--space-4) var(--space-3)}
dialog h2{margin-bottom:var(--space-2)}
dialog .dfoot{display:flex;gap:var(--space-2);padding:var(--space-3) var(--space-4) var(--space-4);flex-wrap:wrap}
dialog .dfoot .btn{flex:1}
dialog.wide{width:min(48rem,calc(100% - 2*var(--space-3)))}
.sum{list-style:none;padding:0;display:grid;gap:var(--space-1);font-size:15px}
.sum li{display:flex;gap:var(--space-2)}
.sum b{flex:none;min-width:5.5em;color:var(--text2);font-weight:500}

/* ── 알림·복사 ── */
.toast{position:fixed;left:50%;bottom:calc(var(--space-6) + 40px);transform:translateX(-50%);background:#212529;color:#fff;padding:var(--space-2) var(--space-3);border-radius:10px;font-size:15px;z-index:20;box-shadow:var(--sh);animation:rise .2s ease-out;max-width:calc(100% - 2*var(--space-3))}
.copy{position:relative;display:inline-flex}
.tip{position:absolute;bottom:calc(100% + var(--space-1));left:50%;transform:translateX(-50%);background:#212529;color:#fff;font-size:13px;border-radius:6px;padding:0 var(--space-2);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.tip:not(:empty){opacity:1}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* ── 다 냈어요 ── */
.done{text-align:center;padding:var(--space-5) var(--space-3)}
.done .big{font-size:48px;line-height:1}
.done h2{font-size:20px;margin:var(--space-3) 0 var(--space-2)}
.pinbox{display:inline-block;margin:var(--space-3) 0;padding:var(--space-2) var(--space-4);background:var(--accent-soft);border-radius:12px;font-size:28px;font-weight:900;letter-spacing:.25em;color:var(--accent)}

/* ── 심사판 ── */
.tbar{position:sticky;top:0;z-index:6;background:rgba(248,249,250,.95);padding:var(--space-2) 0;margin-bottom:var(--space-2)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2)}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(8,1fr)}}
.tile{display:block;text-align:left;border:1px solid var(--border);border-radius:12px;background:#fff;padding:var(--space-2) var(--space-3);font:inherit;cursor:pointer;color:var(--text);min-height:72px}
.tile b{display:block;font-size:26px;font-weight:900;line-height:1.2}
.tile span{font-size:13px;color:var(--text2)}
.tile.hi b{color:var(--accent)}
table.dt{width:100%;border-collapse:collapse;font-size:15px}
.dt th,.dt td{padding:var(--space-2);border-bottom:1px solid var(--surface2);text-align:center}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt thead th{font-size:13px;color:var(--text3);font-weight:500}
.num{min-width:40px;min-height:32px;border:0;background:none;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;border-radius:8px;text-decoration:underline}
.num:disabled{color:var(--text3);text-decoration:none;cursor:default;font-weight:400}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:var(--space-1);gap:var(--space-1)}
.seg button{min-height:40px;border:0;background:none;border-radius:8px;padding:0 var(--space-3);font:inherit;font-size:15px;cursor:pointer;color:var(--text2)}
.seg button[aria-pressed=true]{background:#fff;color:var(--text);font-weight:700;box-shadow:var(--sh)}
.filters{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.filters select,.filters input{height:40px;font-size:15px;width:auto;min-width:8rem}
.group{margin-top:var(--space-4)}
.group>h3{font-size:16px;margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-2)}
.cards{display:grid;gap:var(--space-2)}
@media (min-width:768px){.cards{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.cards{grid-template-columns:1fr 1fr 1fr}}
.ap{background:#fff;border:1px solid var(--border);border-radius:12px;padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)}
.ap.st-불합격,.ap.st-취소{opacity:.6}
.ap header{display:flex;justify-content:space-between;gap:var(--space-2);align-items:flex-start}
.ap header b{font-size:17px}
.badges{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.bd{font-size:12px;border-radius:6px;padding:0 var(--space-2);line-height:24px;background:var(--surface2);color:var(--text2)}
.bd.cand{background:var(--warn-soft);color:var(--warn);font-weight:700}
.bd.lead{background:var(--accent-soft);color:var(--accent)}
.bd.pass{background:var(--good-soft);color:var(--good)}
.ap .prefs{font-size:14px;color:var(--text2)}
.ap .ctl{display:flex;gap:var(--space-2);flex-wrap:wrap}
.ap .ctl select{height:40px;font-size:15px;flex:1;min-width:7rem}
.ap .memo{display:flex;gap:var(--space-2)}
.ap .memo input{height:40px;font-size:15px}
.ap details summary{cursor:pointer;font-size:14px;color:var(--accent);min-height:32px;display:flex;align-items:center}
.ans{display:grid;gap:var(--space-2);margin-top:var(--space-2);font-size:14px}
.ans dt{font-weight:700;color:var(--text2)}
.ans dd{margin:0;white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:var(--space-2)}
.list{list-style:none;padding:0;font-size:15px}
.list li{padding:var(--space-2) 0;border-top:1px solid var(--surface2);display:flex;justify-content:space-between;gap:var(--space-2)}
.list li:first-child{border-top:0}
.empty{color:var(--text3);font-size:14px;padding:var(--space-3) 0}
/* 카드가 여러 장 이어지면 보일 때 한 장씩 살짝 떠오른다(움직임 표 «Scroll-triggered») */
.reveal{opacity:0;transform:translateY(8px);transition:opacity .3s ease-out,transform .3s ease-out}
.reveal.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.toast{animation:none}.tip{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="off"><p class="sub">불러오는 중…</p></div>

<!-- 앱 안 확인 창(브라우저 confirm 대신, 효니 규칙) -->
<dialog id="askDlg" aria-labelledby="askTitle">
  <form method="dialog">
    <div class="dbody"><h2 id="askTitle"></h2><div id="askBody"></div></div>
    <div class="dfoot"><button class="btn ghost" value="no" id="askNo">취소</button><button class="btn" value="yes" id="askYes" autofocus>확인</button></div>
  </form>
</dialog>
<!-- 고치기: 학번+확인 번호 -->
<dialog id="editDlg" aria-labelledby="editTitle">
  <form method="dialog" id="editForm">
    <div class="dbody">
      <h2 id="editTitle">낸 신청서 고치기</h2>
      <p class="sub">신청서를 낼 때 정한 확인 번호 4자리를 넣어 주세요.</p>
      <div class="field"><label for="eSid">학번 5자리</label><input type="text" id="eSid" inputmode="numeric" maxlength="5" autocomplete="off" autofocus></div>
      <div class="field"><label for="ePin">확인 번호 4자리</label><input type="password" id="ePin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off"></div>
      <p class="err" id="editErr" style="display:block" role="status"></p>
    </div>
    <!-- 폰 키보드 «이동»(Enter)이 «닫기»로 가지 않게 닫기는 type=button -->
    <div class="dfoot"><button type="button" class="btn ghost" data-act="closeEdit">닫기</button><button class="btn" value="go" id="editGo">불러오기</button></div>
  </form>
</dialog>
<!-- 심사판: 숫자를 누르면 명단 -->
<dialog id="listDlg" class="wide" aria-labelledby="listTitle" closedby="any">
  <div class="dbody"><h2 id="listTitle"></h2><ul class="list" id="listBody"></ul></div>
  <div class="dfoot">
    <span class="copy" style="flex:1"><button type="button" class="btn line block" data-copy="list" aria-label="이 명단 복사">명단 복사</button><span class="tip" role="status"></span></span>
    <form method="dialog" style="flex:1;display:flex"><button class="btn ghost block">닫기</button></form>
  </div>
</dialog>

<script>
'use strict';
/* ═════════════════════════════════════════════════
 * 2027 학생회 집행부 임원 신청서 + 교사 심사판 (2026-11-14)
 *  - 학생: apply.html — 로그인 없이 학번·이름 + 확인 번호 4자리. 마감 전 «고치기»로 다시 낸다.
 *  - 선생님: apply.html?teacher=1 — 상점 관리 비밀번호로 연다(sangjeom과 같은 앱스크립트, apps-script/sangjeom/Apply.gs).
 *  - 시험: ?mock=1 을 붙이면 서버 대신 이 브라우저 안의 가짜 데이터로 돈다(실제 시트에 안 씀).
 *  - 문항은 아래 FORM만 고치면 된다(효니 «초안, 나중에 고칠 수 있게»). 서버는 답을 그대로 저장하므로 문항을 바꿔도 서버는 안 고쳐도 된다.
 *    id는 영어 소문자로 시작(서버 검사), 이미 받은 답이 있으면 id는 바꾸지 말고 label만 고친다.
 * ═════════════════════════════════════════════════ */
const API='https://script.google.com/macros/s/AKfycbwRshPtn7P5sr_kedozgPopixxQhZiDsWqCZqUg4HXJmPJRZA-HLkFXPiRzePgV55e7TQ/exec';
const DEADLINE_TEXT='12월 4일(금)';
const SCHEDULE=[
  ['신청','지금 ~ 12. 4.(금)'],
  ['서류 심사','12. 7.~12. 11.'],
  ['면접','2027년 1월 초(날짜는 따로 알려요)'],
  ['임명','2027년 3월 초']
];
// 부서별 하는 일 — 실제 기준(2026-11-02 정리). 자율질서부·행사진행부 설명은 초안이라 효니 확인 필요
const DEPTS=[
  {name:'자율질서부',does:'질서 캠페인, 학교 규칙을 함께 지키는 활동'},
  {name:'알림부',does:'«대영알리미»로 학생회 소식 전하기'},
  {name:'행사진행부',does:'학생의 날·축제 같은 학생회 행사 준비와 진행'},
  {name:'홍보기획부',does:'행사 홍보 영상·포스터 만들기, 학생회 SNS'}
];
const TRACKS={
  new:{label:'신규 임원',desc:'지금 학생회 임원이 아닌 1학년'},
  member:{label:'기존 임원 계속',desc:'지금 학생회 임원이고 내년에도 계속 할래요'},
  lead:{label:'부장·차장',desc:'지금 2학년이면 누구나(임원이 아니어도 돼요)'}
};
// type: long(긴 글) / short(한 줄) / choice(하나 고르기, options) / check(동의 상자)
const FORM={
  new:[

async function call(body,timeout=30000){

  const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),timeout);
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify(body),signal:ac.signal});
    const j=await r.json();
    return j&&typeof j.ok==='boolean'?j:{ok:false,error:'not_ready'};

}

// closedby="any"(바깥 눌러 닫기)를 모르는 브라우저(사파리)용. 누른 곳과 뗀 곳이 모두 바깥일 때만 닫는다
if(!('closedBy' in HTMLDialogElement.prototype)){
  const outside=(e,d)=>{const r=d.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};
  document.querySelectorAll('dialog[closedby="any"]').forEach(d=>{let p=false;d.addEventListener('pointerdown',e=>{p=outside(e,d)});d.addEventListener('pointerup',e=>{if(p&&outside(e,d))d.close()})});
}

/* ── 복사 버튼: 버튼 옆 말풍선이 곧 화면 읽기 알림(role=status) ── */
const copyTimers=new WeakMap();let lastCopyMsg='';
async function copyText(btn,text){
  let ok=true;
  try{await navigator.clipboard.writeText(text)}catch(e){ok=false}
  const tip=btn.nextElementSibling;clearTimeout(copyTimers.get(btn));
  let msg=ok?'복사했어요':'복사가 안 됐어요';if(msg===lastCopyMsg)msg+=' ';lastCopyMsg=msg;
  if(tip&&tip.classList.contains('tip')){tip.textContent='';requestAnimationFrame(()=>{tip.textContent=msg})}else toast(msg);
  copyTimers.set(btn,setTimeout(()=>{if(tip)tip.textContent=''},2000));
}

/* ── 오류 표시: :user-invalid(손댄 뒤에만 빨강)와 aria-invalid를 맞춘다 ── */
const announcer=document.createElement('div');announcer.setAttribute('aria-live','polite');announcer.className='visually-hidden';document.body.append(announcer);
const HAS_UI=(()=>{try{return CSS.supports('selector(:user-invalid)')}catch(e){return false}})();
const isUserInvalid=el=>HAS_UI?el.matches(':user-invalid'):el.classList.contains('ui-fb');
const linkError=(el,shown)=>{const id=el.dataset.error;if(!id)return;const ids=(el.getAttribute('aria-describedby')||'').split(/\s+/).filter(x=>x&&x!==id);if(shown)ids.push(id);if(ids.length)el.setAttribute('aria-describedby',ids.join(' '));else el.removeAttribute('aria-describedby')};
let announceTimer;
function syncAria(el,announce){
  if(!el||!el.matches||!el.matches('input,select,textarea')||!el.closest('#applyForm'))return;
  const field=el.closest('.field');
  if(!HAS_UI&&field&&field.dataset.touched)el.classList.toggle('ui-fb',!el.validity.valid);
  const bad=isUserInvalid(el);
  el.setAttribute('aria-invalid',bad?'true':'false');linkError(el,bad);
  if(field&&!HAS_UI)field.classList.toggle('inv',bad);
  if(bad&&announce){const er=document.getElementById(el.dataset.error);if(er){clearTimeout(announceTimer);announcer.textContent='';announceTimer=setTimeout(()=>{announcer.textContent='오류: '+er.textContent.trim()},500)}}
}
document.addEventListener('blur',e=>{const f=e.target.closest&&e.target.closest('.field');if(f&&e.target.value)f.dataset.touched='1';syncAria(e.target,true)},true);
document.addEventListener('input',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('aria-invalid'))syncAria(e.target)});
document.addEventListener('change',e=>{const f=e.target.closest&&e.target.closest('.field');if(f)f.dataset.touched='1';syncAria(e.target,true);
  // 라디오는 한 칸만 바뀌므로 같은 묶음 모두 맞춘다
  if(e.target.type==='radio')document.querySelectorAll('input[name="'+e.target.name+'"]').forEach(x=>syncAria(x))},true);
document.addEventListener('invalid',e=>{const f=e.target.closest&&e.target.closest('.field');if(f)f.dataset.touched='1';syncAria(e.target)},true);

function curTrack(){const r=document.querySelector('input[name=track]:checked');return r?r.value:''}
function onFormInput(e){
  const f=document.getElementById('applyForm');if(!f)return;
  const t=curTrack();
  f.querySelectorAll('.trackset').forEach(s=>{const on=s.dataset.track===t;s.hidden=!on;s.disabled=!on});
  const roleBox=document.getElementById('roleBox');roleBox.hidden=t!=='lead';
  roleBox.querySelectorAll('input').forEach(x=>{x.required=t==='lead';x.disabled=t!=='lead'});
  // 학번 학년과 지원 구분이 맞는지(서버도 다시 본다)
  const g=(document.getElementById('sid').value||'')[0];
  let msg='';
  if(t&&(g==='1'||g==='2')){
    if(t==='new'&&g==='2'&&!INFO.g2New)msg='신규 임원은 지금 1학년만 낼 수 있어요.';
    if(t==='lead'&&g!=='2')msg='부장·차장은 지금 2학년만 낼 수 있어요.';
  }
  document.querySelectorAll('input[name=track]').forEach(x=>x.setCustomValidity(msg));
  document.getElementById('trackErrText').textContent=msg||'하나를 골라 주세요.';
  if(msg){const fs=document.querySelector('input[name=track]').closest('.field');fs.dataset.touched='1';document.querySelectorAll('input[name=track]').forEach(x=>{if(!HAS_UI)x.classList.add('ui-fb');syncAria(x)})}

  d2.setCustomValidity(d2.value&&d2.value===d1?'같은 부서':'');
  document.getElementById('prNote').hidden=!(d1==='홍보기획부'||d2.value==='홍보기획부');
  f.querySelectorAll('[data-count]').forEach(c=>{const ta=document.getElementById(c.dataset.count);c.textContent=ta.value.length+' / '+ta.maxLength});
  if(e&&!EDIT)saveDraftSoon();

let draftTimer;
function saveDraftSoon(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{const v=readForm(true);delete v.pin;store.set(DRAFT_KEY,JSON.stringify(v))},600)}
function restoreDraft(){let d=null;try{d=JSON.parse(store.get(DRAFT_KEY)||'null')}catch(e){}if(!d)return;fillForm(d);toast('쓰던 내용을 불러왔어요.')}
function readForm(raw){
  const f=document.getElementById('applyForm');const val=n=>{const el=f.querySelector('[name="'+n+'"]:checked')||f.querySelector('[name="'+n+'"]');return el?(el.type==='radio'?(el.checked?el.value:''):el.value):''};
  const t=curTrack();
  const qs=(FORM[t]||[]).concat(FORM.end);
  const answers={},labels={};
  (raw?Object.keys(TRACKS).flatMap(k=>FORM[k]).concat(FORM.end):qs).forEach(q=>{
    if(q.type==='check'){const el=f.querySelector('[name="'+q.id+'"]');answers[q.id]=!!(el&&el.checked)}
    else{const v=val(q.id).trim();if(v||q.required)answers[q.id]=v}
    labels[q.id]=q.label});
  return {sid:val('sid').trim(),name:val('name').trim(),gender:val('gender'),track:t,role:t==='lead'?val('role'):'',d1:val('d1'),d2:val('d2'),cand:!!f.querySelector('#cand').checked,pin:val('pin'),answers,labels};
}
function fillForm(d){
  const f=document.getElementById('applyForm');if(!f||!d)return;
  const set=(n,v)=>{f.querySelectorAll('[name="'+n+'"]').forEach(el=>{if(el.type==='radio')el.checked=el.value===v;else if(el.type==='checkbox')el.checked=!!v;else if(v!=null)el.value=v})};
  ['sid','name','gender','track','d1','d2'].forEach(n=>set(n,d[n]||''));
  set('role',d.role||'');set('cand',!!d.cand);
  Object.keys(d.answers||{}).forEach(k=>set(k,d.answers[k]));
  onFormInput();
}

    <div class="ctl"><label class="visually-hidden" for="st-${esc(r.id)}">${esc(r.name)} 심사 상태</label>
      <select id="st-${esc(r.id)}" data-status="${esc(r.id)}">${BOARD.statuses.map(s=>`<option ${s===r.status?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <span class="copy"><button type="button" class="btn xs ghost" data-copy="one" data-id="${esc(r.id)}" aria-label="${esc(r.name)} 신청서 복사">복사</button><span class="tip" role="status"></span></span>
      <button type="button" class="btn xs ghost" data-act="resetPin" data-id="${esc(r.id)}" ${r.pinless?'disabled':''}>${r.pinless?'번호 풀림':'확인 번호 풀기'}</button></div>
    <div class="memo"><label class="visually-hidden" for="mm-${esc(r.id)}">${esc(r.name)} 심사 메모</label><input type="text" id="mm-${esc(r.id)}" maxlength="300" placeholder="심사 메모" value="${esc(r.memo)}"><button type="button" class="btn xs line" data-act="memo" data-id="${esc(r.id)}">저장</button></div>
    <details><summary>답 보기</summary><dl class="ans">${ans||'<dd>답이 없어요</dd>'}</dl></details>
  </article>`;
}
let revealObs=null;
function renderGroups(){
  const box=document.getElementById('groups');if(!box)return;
  const rows=filtered();
  box.innerHTML=groupsOf(rows).map(([name,list])=>`<div class="group"><h3>${esc(name)} <span class="bd">${list.length}명</span></h3>${list.length?`<div class="cards">${list.map(apCard).join('')}</div>`:'<p class="empty">없어요</p>'}</div>`).join('');
  if(revealObs)revealObs.disconnect();
  if('IntersectionObserver' in window){let n=0;revealObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const el=e.target;el.style.transitionDelay=Math.min(n++%6,5)*0.05+'s';el.classList.add('show');revealObs.unobserve(el)}})},{rootMargin:'0px 0px -5% 0px'});box.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el))}
  else box.querySelectorAll('.reveal').forEach(el=>el.classList.add('show'));
  // 인쇄·전체 화면 캡처처럼 스크롤 없이 보는 경우에도 카드가 투명하게 남지 않게
  setTimeout(()=>box.querySelectorAll('.reveal:not(.show)').forEach(el=>el.classList.add('show')),1500);
}
const rowText=r=>[r.sid,r.name,r.gender,r.track+(r.role?'('+r.role+')':''),r.d1,r.d2||'',r.cand?'회장 후보':'',r.status].join('\t');
const HEAD='학번\t이름\t성별\t구분\t1지망\t2지망\t회장 후보\t상태';
function oneText(r){return rowText(r).split('\t').filter(Boolean).join(' / ')+'\n'+Object.keys(r.answers||{}).map(k=>'['+(qLabel[k]||k)+'] '+(r.answers[k]===true?'예':r.answers[k]===false?'아니오':r.answers[k])).join('\n')}
let OPEN_LIST=null;
function showList(i){
  const L=LISTS[i];if(!L)return;OPEN_LIST=L;
  document.getElementById('listTitle').textContent=L.title+' · '+L.rows.length+'명';
  document.getElementById('listBody').innerHTML=L.rows.slice().sort((a,b)=>a.sid.localeCompare(b.sid)).map(r=>`<li><span><b>${esc(r.name)}</b> <span class="muted">${esc(sidLabel(r.sid))} · ${esc(r.gender)}</span></span><span class="muted">${esc(r.track)} · ${esc(r.d1)}${r.d2?'→'+esc(r.d2):''}${r.cand?' · 후보':''}</span></li>`).join('')||'<li class="empty">없어요</li>';
  document.getElementById('listDlg').showModal();
}
async function mark(id,body,okMsg){
  const r=await call(Object.assign({action:'apAdminMark',key:KEY,id},body));
  if(!r.ok){toast(errText(r.error));return false}
  const i=BOARD.rows.findIndex(x=>x.id===id);if(i>=0)BOARD.rows[i]=r.row;
  toast(okMsg);return true;
}

/* ── 클릭·바꾸기는 한 곳에서(data-act) ── */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const act=b.dataset.act;
  if(b.dataset.list!=null){showList(+b.dataset.list);return}
  if(b.dataset.by){VIEW.by=b.dataset.by;document.querySelectorAll('[data-by]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));renderGroups();return}
  if(b.dataset.copy==='list'&&OPEN_LIST){copyText(b,HEAD+'\n'+OPEN_LIST.rows.map(rowText).join('\n'));return}
  if(b.dataset.copy==='filtered'){copyText(b,HEAD+'\n'+filtered().map(rowText).join('\n'));return}
  if(b.dataset.copy==='one'){const r=BOARD.rows.find(x=>x.id===b.dataset.id);if(r)copyText(b,oneText(r));return}
  if(act==='openEdit')return openEdit();
  if(act==='closeEdit'){document.getElementById('editDlg').close('');return}
  if(act==='clearDraft'){store.del(DRAFT_KEY);renderStudent();toast('이 기기에 저장된 글을 지웠어요.');return}
  if(act==='cancelEdit'){EDIT=null;renderStudent();return}
  if(act==='again'){renderStudent();window.scrollTo(0,0);return}
  if(act==='reload')return loadBoard();
  if(act==='toggleOpen'){
    const to=!BOARD.open;
    if(!await ask(to?'신청을 열까요?':'신청을 닫을까요?',to?'<p>학생들이 바로 낼 수 있어요. 마감('+esc(DEADLINE_TEXT)+')이 지나면 열어 둬도 받지 않아요.</p>':'<p>닫으면 학생이 새로 내거나 고칠 수 없어요. 다시 열 수 있어요.</p>',to?'열기':'닫기'))return;
    const r=await call({action:'apAdminSet',key:KEY,open:to});if(!r.ok){toast(errText(r.error));return}
    return loadBoard(true).then(()=>toast(to?'신청을 열었어요.':'신청을 닫았어요.'));
  }
  if(act==='toggleG2'){
    const to=!BOARD.g2New;
    if(!await ask(to?'2학년 신규 추가 모집을 켤까요?':'2학년 신규 추가 모집을 끌까요?',to?'<p>지금 2학년도 «신규 임원»으로 낼 수 있게 돼요.</p>':'<p>이미 낸 2학년 신청서는 그대로 남아요.</p>',to?'켜기':'끄기'))return;
    const r=await call({action:'apAdminSet',key:KEY,g2New:to});if(!r.ok){toast(errText(r.error));return}
    return loadBoard(true).then(()=>toast(to?'2학년 추가 모집을 켰어요.':'2학년 추가 모집을 껐어요.'));
  }
  if(act==='memo'){const v=document.getElementById('mm-'+b.dataset.id).value;b.disabled=true;await mark(b.dataset.id,{memo:v},'메모를 저장했어요.');b.disabled=false;return}
  if(act==='resetPin'){
    const r=BOARD.rows.find(x=>x.id===b.dataset.id);if(!r)return;
    if(!await ask('확인 번호를 풀까요?','<p>'+esc(r.name)+' 학생이 확인 번호를 잊었을 때만 써요. 풀면 학생이 다음에 «고치기»에서 넣는 번호가 새 확인 번호가 돼요. 학생이 고치기 전까지는 누구나 이 학번으로 신청서를 열 수 있으니, 학생에게 바로 고치라고 알려 주세요.</p>','풀기',true))return;
    if(await mark(r.id,{resetPin:true},'확인 번호를 풀었어요.'))renderGroups();
  }
});
document.addEventListener('change',async e=>{
  const s=e.target.closest('select[data-status]');if(s){s.disabled=true;const ok=await mark(s.dataset.status,{status:s.value},'«'+s.value+'»로 바꿨어요.');s.disabled=false;if(ok)renderBoard();return}
  if(e.target.id==='fStatus'){VIEW.status=e.target.value;renderGroups()}
});
document.addEventListener('input',e=>{if(e.target.id==='fQ'){VIEW.q=e.target.value;renderGroups()}});

/* ── 시작 ── */
(async function(){
  if(IS_TEACHER){if(KEY)await loadBoard(true);else renderLogin('');return}
  const r=await call({action:'apInfo'});
  if(r.ok)INFO={open:!!r.open,g2New:!!r.g2New};else if(r.error==='net')toast(ERR.net);
  renderStudent();
})();
</script>
