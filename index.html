<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대영중 학생회</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap');
:root{
  --bg:#f8f9fa;--surface:#fff;--surface2:#f1f3f5;--border:#dee2e6;
  --accent:#6c63ff;--accent2:#ff6b9d;--accent3:#2f9e44;
  --warn:#e67700;--danger:#c92a2a;--info:#1971c2;
  --text:#212529;--text2:#495057;--text3:#adb5bd;--r:12px;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 12px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
button{cursor:pointer;font-family:inherit;border:none;outline:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;width:100%;font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
select option,optgroup{background:var(--surface)}
input[type=date]{color-scheme:light}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.tag-예정{background:#e7f5ff;color:#1971c2}
.tag-진행중{background:#fff3bf;color:#946900}
.tag-완료{background:#ebfbee;color:#2f9e44}
.tag-보류{background:#fff4e6;color:#e67700}

.db{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.db-회장단{background:#f3f0ff;color:#7048e8}
.db-알림부{background:#e3fafc;color:#0c8599}
.db-행사진행부{background:#ebfbee;color:#2f9e44}
.db-홍보기획부{background:#fff9db;color:#e67700}
.db-자율질서부{background:#fff0f6;color:#c2255c}

/* 버튼 */
.bp{background:var(--accent);color:#fff;padding:12px;border-radius:10px;font-size:14px;font-weight:700;width:100%;display:block;text-align:center;box-shadow:var(--sh);transition:all .2s}
.bp:hover{background:#5a52d5}
.bc{padding:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:10px;font-size:14px;font-weight:600;transition:all .2s;flex:1}
.bs{padding:12px;background:var(--accent);border:none;color:#fff;border-radius:10px;font-size:14px;font-weight:700;transition:all .2s;flex:2}

/* 모드 선택 */
#modeSelect{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;gap:32px;background:linear-gradient(135deg,#f8f9fa,#e9ecef)}
.logo-s{font-size:11px;color:var(--text3);letter-spacing:3px;font-family:'Space Mono',monospace;margin-bottom:8px}
.logo-t{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.logo-sub{font-size:13px;color:var(--text2);margin-top:8px}
.mode-wrap{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;cursor:pointer;transition:all .25s;text-align:left;width:100%;box-shadow:var(--sh)}
.mc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--sh2)}
.mc.t:hover{border-color:var(--accent2)}
.mc-i{font-size:28px;margin-bottom:12px}.mc-t{font-size:18px;font-weight:700;margin-bottom:4px}.mc-d{font-size:13px;color:var(--text2);line-height:1.6}

/* 비밀번호 화면 */
#pwScreen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;background:linear-gradient(135deg,#f8f9fa,#e9ecef)}
.pw-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:32px 24px;width:100%;max-width:320px;box-shadow:var(--sh2);text-align:center}
.pw-title{font-size:18px;font-weight:700;margin-bottom:6px}
.pw-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
#pwInput{text-align:center;font-size:24px;letter-spacing:8px;font-family:'Space Mono',monospace;margin-bottom:8px}
.pw-err{font-size:12px;color:var(--danger);margin-bottom:12px;min-height:18px}
.pw-back{font-size:13px;color:var(--text3);background:none;border:none;cursor:pointer;margin-top:8px;font-family:inherit;display:block;width:100%;text-align:center}

/* 앱 헤더 */
.ah{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);width:36px;height:36px;border-radius:8px;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.ah h2{font-size:16px;font-weight:700;flex:1}
.hbadge{font-family:'Space Mono',monospace;font-size:11px;color:var(--text3)}
.lock-btn{font-size:12px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit;transition:all .2s}
.lock-btn:hover{border-color:var(--danger);color:var(--danger)}

/* 탭 */
.tnav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;box-shadow:var(--sh)}
.ti{flex:1;min-width:60px;padding:12px 6px;text-align:center;font-size:12px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;font-weight:500;background:none;-webkit-tap-highlight-color:transparent}
.ti.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.ti .tn{display:block;font-family:'Space Mono',monospace;font-size:10px;margin-bottom:2px;opacity:.7}
.tp{display:none;padding:20px}.tp.active{display:block}

/* 이름 선택 */
.nw{margin-bottom:20px}.nw label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;font-weight:500}

/* 업무 카드 */
.tc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh)}
.tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.tc-ti{font-size:14px;font-weight:600;line-height:1.4;flex:1}
.tc-r{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.tc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.tc-date{font-size:11px;color:var(--text2);font-family:'Space Mono',monospace}
.tc-date.urg{color:var(--danger);font-weight:700}
.shared-b{font-size:10px;padding:2px 7px;border-radius:4px;background:#f3f0ff;color:var(--accent);font-weight:700}

/* 세부 태스크 */
.sl{margin-top:8px}
.si{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.si:last-child{border-bottom:none}
.sc{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--surface)}
.sc.done{background:var(--accent3);border-color:var(--accent3)}
.sc.done::after{content:'✓';font-size:12px;color:#fff;font-weight:900}
.st2{font-size:13px;flex:1}.st2.done{text-decoration:line-through;color:var(--text3)}
.sd2{font-size:11px;color:var(--text2);font-family:'Space Mono',monospace;cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.sd2:hover{border-color:var(--border);background:var(--surface2)}
.sdel2{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;padding:0 2px;flex-shrink:0}
.sdel2:hover{color:var(--danger)}
.add-si{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.add-si input{flex:1;font-size:12px;padding:6px 10px;height:32px}
.add-si .dm{width:110px;flex-shrink:0;font-size:12px;padding:6px 8px;height:32px}
.add-si button{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:0 12px;height:32px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}

/* 진행바 */
.pw2{margin:6px 0 4px}
.pl{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px}
.pb{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .3s}

/* 마감 칩 */
.chip{font-size:10px;padding:2px 7px;border-radius:4px;font-family:'Space Mono',monospace;font-weight:700}
.chip-over{background:#ffe3e3;color:var(--danger);animation:pulse 1.5s infinite}
.chip-today{background:#fff3bf;color:var(--warn)}
.chip-soon{background:#fff9db;color:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* 상태바 */
.sb{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.sb-btn{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--text2);transition:all .15s}
.sb-btn.a-예정{background:#e7f5ff;color:#1971c2;border-color:#74c0fc}
.sb-btn.a-진행중{background:#fff3bf;color:#946900;border-color:#ffd43b}
.sb-btn.a-완료{background:#ebfbee;color:#2f9e44;border-color:#8ce99a}
.sb-btn.a-보류{background:#fff4e6;color:#e67700;border-color:#ffa94d}

/* 편집/삭제 버튼 */
.eb{background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:3px 9px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.eb:hover{border-color:var(--accent);color:var(--accent);background:#f3f0ff}
.del-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text3);padding:3px 9px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.del-btn:hover{border-color:var(--danger);color:var(--danger);background:#ffe3e3}

/* 완료 토글 */
.dt{display:flex;align-items:center;gap:8px;padding:10px 0 12px;cursor:pointer;color:var(--text3);font-size:12px;border-top:1px solid var(--border);margin-top:6px;user-select:none;-webkit-tap-highlight-color:transparent}
.dt:hover{color:var(--text2)}
.dt .arr{transition:transform .2s;font-size:10px;display:inline-block}
.dt.open .arr{transform:rotate(90deg)}
.dl{display:none}.dl.open{display:block}

/* 시간대 그룹 */
.tg{margin-bottom:20px}
.tgl{font-size:11px;font-weight:700;letter-spacing:1px;font-family:'Space Mono',monospace;padding:4px 0 10px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tgd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tg-ov{color:var(--danger)}.tg-td{color:var(--warn)}.tg-wk{color:var(--info)}.tg-lt{color:var(--text2)}.tg-nd{color:var(--text3)}

/* 통계 카드 */
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.sc2{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--sh)}
.sn{font-size:32px;font-weight:900;font-family:'Space Mono',monospace;line-height:1;margin-bottom:4px}
.sl2{font-size:12px;color:var(--text2)}
.sc2.c1 .sn{color:var(--accent)}.sc2.c2 .sn{color:var(--accent3)}.sc2.c3 .sn{color:var(--warn)}.sc2.c4 .sn{color:var(--danger)}

/* 섹션 타이틀 */
.stl{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:1px;font-family:'Space Mono',monospace;padding:4px 0 10px;margin-top:20px;border-bottom:1px solid var(--border);margin-bottom:12px}

/* 피드 */
.feed-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.feed-item:last-child{border-bottom:none}
.feed-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.feed-info{flex:1}.feed-nm{font-size:12px;font-weight:600;margin-bottom:2px}
.feed-tk{font-size:13px}.feed-tm{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;white-space:nowrap}

/* 달력 */
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
.cn:hover{border-color:var(--accent);color:var(--accent)}
.ct{font-size:15px;font-weight:700}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdow{text-align:center;font-size:10px;color:var(--text3);padding:6px 0;font-family:'Space Mono',monospace;font-weight:600}
.cday{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 2px;cursor:pointer;background:var(--surface);border:1px solid transparent;min-height:38px;overflow:hidden;transition:all .15s;-webkit-tap-highlight-color:transparent}
.cday:hover{border-color:var(--border);background:var(--surface2)}
.cday.today{border-color:var(--accent);background:#f3f0ff}
.cday.other{opacity:.35}.cday.sel{background:#f3f0ff;border-color:var(--accent)}
.dnum{font-size:11px;font-family:'Space Mono',monospace;line-height:1;margin-bottom:2px}
.cday.today .dnum{color:var(--accent);font-weight:700}
.ddots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.ddot{width:4px;height:4px;border-radius:50%}
.cdet{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--sh)}
.cdet-d{font-size:12px;color:var(--text2);margin-bottom:12px;font-family:'Space Mono',monospace;font-weight:600}
.ctr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.ctr:last-child{border-bottom:none}
.cbar{width:4px;height:36px;border-radius:2px;flex-shrink:0}

/* 부서 */
.ds{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dp{height:5px;background:var(--surface2);border-radius:3px;margin-bottom:12px;overflow:hidden}
.dpf{height:100%;border-radius:3px;transition:width .5s}

/* 학생 행 */
.sr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.sr:last-child{border-bottom:none}
.sr:hover{background:var(--surface2);margin:0 -16px;padding:12px 16px;border-radius:8px}
.sav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.mb{width:80px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:4px}
.mf{height:100%;border-radius:3px}

/* 필터 */
.fb{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.fc{padding:6px 14px;border-radius:20px;font-size:12px;background:var(--surface);border:1px solid var(--border);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;-webkit-tap-highlight-color:transparent}
.fc.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* 폼 */
.fg{margin-bottom:16px}
.fg label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;font-weight:500}
.req{color:var(--accent2);margin-left:2px}
.hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.6}
.sir{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.sir input{flex:1}
.dm{width:130px;flex-shrink:0}
.sdel{background:var(--surface2);border:1px solid var(--border);color:var(--text3);width:32px;height:38px;border-radius:8px;font-size:14px;flex-shrink:0;cursor:pointer;transition:all .2s}
.sdel:hover{border-color:var(--danger);color:var(--danger)}
.asb{background:var(--surface2);border:1px dashed var(--border);color:var(--text2);padding:10px;border-radius:8px;width:100%;font-size:13px;cursor:pointer;font-family:inherit;margin-top:4px;transition:all .2s}
.asb:hover{border-color:var(--accent);color:var(--accent)}

/* 모달 */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;align-items:flex-end;justify-content:center}
.mov.open{display:flex}
.ms{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px 36px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;animation:su .25s ease;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.mt{font-size:15px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.ma{display:flex;gap:8px;margin-top:20px}

/* 체크박스 그룹 */
.cb-group{display:flex;flex-direction:column}
.cb-dh{font-size:12px;font-weight:700;color:var(--text2);padding:10px 0 6px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cb-dh:hover{color:var(--text)}
.cb-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border)}
.cb-item:last-child{border-bottom:none}
.cb-item label{font-size:13px;cursor:pointer;flex:1}

/* 미배정 */
.ua{background:#fff9db;border:1px solid #ffd43b;border-radius:var(--r);padding:14px;margin-bottom:10px}
.ua-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.ua-ti{font-size:13px;font-weight:600;flex:1;line-height:1.4}
.ua-btns{display:flex;gap:6px;flex-shrink:0}
.abtn{background:var(--accent);color:#fff;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;white-space:nowrap}

/* 미배정 공지 (학생) */
.un-notice{background:#fff9db;border:1px solid #ffd43b;border-radius:var(--r);padding:14px;margin-bottom:16px}
.un-hd{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:8px}
.un-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffe066;font-size:13px}
.un-item:last-child{border-bottom:none}
.un-item .un-name{flex:1;font-weight:600}
.self-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}

/* 검색 */
.sw{position:relative;margin-bottom:16px}
.sw input{padding-left:36px}
.si2{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.sc3{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text3);cursor:pointer;font-size:16px;background:none;border:none;padding:0}
.sc3:hover{color:var(--text)}

/* 빈 상태 */
.empty{text-align:center;padding:40px 24px;color:var(--text3)}
.empty .ei{font-size:36px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.8}

/* 토스트 */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:20px;font-size:13px;font-weight:500;transition:transform .3s;z-index:9999;white-space:nowrap;box-shadow:var(--sh2)}

let tasks=[];
let sCY=new Date().getFullYear(),sCM=new Date().getMonth(),sCS=null;
let tCY=new Date().getFullYear(),tCM=new Date().getMonth(),tCS=null;
let allFilt='전체',sq='';
let _editId=null,_editStatus=null,_assignId=null,_delId=null;

// ── 유틸 ──
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function dU(ds){if(!ds)return null;const d=new Date(ds),n=new Date();n.setHours(0,0,0,0);return Math.floor((d-n)/86400000);}
function fD(ds){if(!ds)return '';const d=new Date(ds);return `${d.getMonth()+1}/${d.getDate()} (${DKO[d.getDay()]})`;}
function dc(dept){return DC[dept]||'#868e96';}
function gm(name){return MEMBERS.find(m=>m.name===name)||{};}
function gd(name){return gm(name).dept||'';}
function chip(ds,st){
  if(!ds||st==='완료')return '';
  const d=dU(ds);
  if(d<0)return '<span class="chip chip-over">기한 초과</span>';
  if(d===0)return '<span class="chip chip-today">오늘 마감</span>';
  if(d<=3)return `<span class="chip chip-soon">D-${d}</span>`;
  return '';
}
function isUA(t){return !t.assignee||t.assignee===''||t.assignee==='미지정'||!t.assignees||t.assignees.length===0;}
function migrate(t){if(!t.assignees){t.assignees=t.allAssignees&&t.allAssignees.length&&t.allAssignees[0]?t.allAssignees:(t.assignee&&t.assignee!=='미지정'?[t.assignee]:[]);}return t;}

// ── 로컬 저장 ──
function saveLocal(){localStorage.setItem(SK,JSON.stringify(tasks));}

// ── Firebase ──
async function fbLoad(){
  try{
    const r=await fetch(FB+'/tasks.json');
    if(!r.ok)return false;
    const data=await r.json();
    if(!data)return false;
    const fbArr=Object.values(data).filter(t=>t&&t.id);
    if(!fbArr.length)return false;
    tasks=fbArr.map(migrate);
    saveLocal();
    return true;
  }catch(e){console.warn('FB load 실패:',e);return false;}
}
async function fbPut(t){
  try{
    await fetch(FB+'/tasks/'+t.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
  }catch(e){console.warn('FB put 실패:',e);}
}
async function fbPutAll(){
  try{
    const obj={};tasks.forEach(t=>{obj[t.id]=t;});
    await fetch(FB+'/tasks.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
  }catch(e){console.warn('FB putAll 실패:',e);}
}
async function fbDel(id){
  try{await fetch(FB+'/tasks/'+id+'.json',{method:'DELETE'});}catch(e){}
}
function gasLog(t){
  if(!GAS||t.status!=='완료')return;
  fetch(GAS,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'updateTask',task:t})}).catch(()=>{});
}

// ── 초기화: 로컬 캐시로 먼저 표시, Firebase로 갱신 ──
function initTasks(){
  const local=JSON.parse(localStorage.getItem(SK)||'null');
  if(local&&local.length){
    tasks=local.map(migrate);
  } else {
    tasks=SEED.map(t=>({...t})).map(migrate);
    saveLocal();
  }
}

// ── 이름 셀렉트 ──
function fillSel(id){
  const el=document.getElementById(id);if(!el)return;
  const cur=el.value;
  el.innerHTML='<option value="">-- 이름 선택 --</option>';
  DEPTS.forEach(dept=>{
    const og=document.createElement('optgroup');og.label=dept;
    MEMBERS.filter(m=>m.dept===dept).forEach(m=>{
      const o=document.createElement('option');o.value=m.name;o.textContent=m.name;og.appendChild(o);
    });
    el.appendChild(og);
  });
  if(cur)el.value=cur;
}
function fillAllSels(){['s0Name','s1Name','s2Name'].forEach(fillSel);}

function buildCWList(ex){
  const c=document.getElementById('cwList');if(!c)return;c.innerHTML='';
  DEPTS.forEach(dept=>{
    const ms=MEMBERS.filter(m=>m.dept===dept&&m.name!==ex);if(!ms.length)return;
    const dh=document.createElement('div');dh.className='cb-dh';
    dh.innerHTML=`<span>${dept}</span><span style="font-size:11px;color:var(--text3)">전체 선택</span>`;
    dh.addEventListener('click',()=>{const cbs=c.querySelectorAll(`.cw-cb[data-dept="${dept}"]`);const a=[...cbs].every(x=>x.checked);cbs.forEach(x=>x.checked=!a);});
    c.appendChild(dh);

// ── 카드 렌더 ──
function card(t,opts){
  opts=opts||{};
  const {showSB,showEB,showDel}=opts;
  const d=dU(t.deadline);
  const cp=chip(t.deadline,t.status);
  const subs=t.subtasks||[];
  const dn=subs.filter(s=>s.done).length;
  const pct=subs.length>0?Math.round(dn/subs.length*100):0;
  const col=dc(t.dept);
  const ass=t.assignees||[t.assignee].filter(Boolean);
  const shB=ass.length>1?'<span class="shared-b">공유 '+ass.length+'명</span>':'';
  const eb=showEB?`<button type="button" class="eb" data-action="edit" data-id="${t.id}">✏️</button>`:'';
  const db=showDel?`<button type="button" class="del-btn" data-action="del" data-id="${t.id}">🗑</button>`:'';
  const dateL=[
    t.date?`<span class="tc-date">📅 행사일 ${fD(t.date)}</span>`:'',
    t.deadline?`<span class="tc-date${d!==null&&d<=3&&t.status!=='완료'?' urg':''}">⏰ 준비마감 ${fD(t.deadline)}</span>`:'',
    cp
  ].filter(Boolean).join('');
  const subH=subs.length?`
    <div class="pw2"><div class="pl"><span>세부 진행</span><span>${dn}/${subs.length}</span></div><div class="pb"><div class="pf" style="width:${pct}%;background:${col}"></div></div></div>
    <div class="sl">${subs.map((s,i)=>`<div class="si">
      <div class="sc${s.done?' done':''}" data-action="togSub" data-id="${t.id}" data-idx="${i}"></div>
      <span class="st2${s.done?' done':''}">${s.text}</span>
      <span class="sd2" data-action="editSD" data-id="${t.id}" data-idx="${i}">${s.date?fD(s.date):'날짜 추가'}</span>
      ${showEB?`<button type="button" class="sdel2" data-action="delSub" data-id="${t.id}" data-idx="${i}">×</button>`:''}
    </div>`).join('')}</div>`:'' ;
  const addH=showEB?`<div class="add-si"><input type="text" placeholder="세부 할 일 추가" id="ns-${t.id}"><input type="date" class="dm" id="nd-${t.id}"><button type="button" data-action="addSub" data-id="${t.id}">추가</button></div>`:'';
  const sbH=showSB?`<div class="sb">${['예정','진행중','완료','보류'].map(s=>`<button type="button" class="sb-btn${t.status===s?' a-'+s:''}" data-action="chgSt" data-id="${t.id}" data-status="${s}">${s}</button>`).join('')}</div>`:'';
  return `<div class="tc" id="c-${t.id}">
    <div class="tc-top"><div class="tc-ti">${t.title}</div><div class="tc-r">${shB}${eb}${db}<span class="tag tag-${t.status}">${t.status}</span></div></div>
    <div class="tc-meta">${t.category?`<span class="db db-${t.dept}">${t.category}</span>`:'<span style="font-size:11px;color:var(--text3);font-style:italic">카테고리 미지정</span>'}${ass.length>1?`<span style="font-size:11px;color:var(--text2)">${ass.join(', ')}</span>`:''}</div>
    ${dateL?`<div class="tc-meta" style="margin-top:2px">${dateL}</div>`:''}
    ${subH}${addH}
    ${t.memo?`<div style="margin-top:8px;font-size:12px;color:var(--text2);line-height:1.6">${t.memo}</div>`:''}
    ${sbH}
  </div>`;
}
function doneSec(list,opts,id){
  if(!list.length)return '';
  const sorted=[...list].sort((a,b)=>{if(!a.completedAt&&!b.completedAt)return 0;if(!a.completedAt)return 1;if(!b.completedAt)return -1;return new Date(b.completedAt)-new Date(a.completedAt);});
  return `<div class="dt" data-done="${id}"><span class="arr">▶</span><span>완료된 업무 ${list.length}개</span></div><div class="dl" id="dl-${id}">${sorted.map(t=>card(t,opts)).join('')}</div>`;
}
function grpTime(list){
  const g={ov:[],td:[],wk:[],lt:[],nd:[]};
  list.forEach(t=>{if(!t.deadline){g.nd.push(t);return;}const d=dU(t.deadline);if(d<0)g.ov.push(t);else if(d===0)g.td.push(t);else if(d<=7)g.wk.push(t);else g.lt.push(t);});
  return g;
}
function renderGrp(list,opts){
  const g=grpTime(list);
  const defs=[{k:'ov',l:'기한 초과',cl:'tg-ov',c:'var(--danger)'},{k:'td',l:'오늘 마감',cl:'tg-td',c:'var(--warn)'},{k:'wk',l:'이번 주',cl:'tg-wk',c:'var(--info)'},{k:'lt',l:'이후',cl:'tg-lt',c:'var(--text2)'},{k:'nd',l:'날짜 미정',cl:'tg-nd',c:'var(--text3)'}];
  let h='';
  defs.forEach(({k,l,cl,c})=>{if(!g[k].length)return;h+=`<div class="tg"><div class="tgl ${cl}"><span class="tgd" style="background:${c}"></span>${l} (${g[k].length})</div>${g[k].map(t=>card(t,opts)).join('')}</div>`;});
  return h||'<div class="empty"><div class="ei">🎉</div><p>업무 없음</p></div>';
}

// ── 상태 변경 ──
function chgSt(id,ns){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  if(ns==='완료'){(t.subtasks||[]).forEach(s=>s.done=true);t.completedAt=new Date().toISOString();}
  if(ns==='예정')(t.subtasks||[]).forEach(s=>s.done=false);
  t.status=ns;saveLocal();fbPut(t);gasLog(t);refresh();
  toast('"'+ns+'"으로 변경');
  if(ns==='완료')setTimeout(openDones,100);
}

// ── 세부 체크 ──
function togSub(id,idx){
  const t=tasks.find(x=>x.id===id);if(!t||!t.subtasks)return;
  t.subtasks[idx].done=!t.subtasks[idx].done;
  const cnt=t.subtasks.filter(s=>s.done).length;
  if(cnt===0)t.status='예정';
  else if(cnt===t.subtasks.length){t.status='완료';t.completedAt=new Date().toISOString();}
  else t.status='진행중';
  saveLocal();fbPut(t);gasLog(t);refresh();
  toast(t.subtasks[idx].done?'✅ 완료!':'↩ 해제');
  if(t.status==='완료')setTimeout(openDones,100);
}

  el.replaceWith(inp);inp.focus();
  const done=()=>{t.subtasks[idx].date=inp.value;saveLocal();fbPut(t);refresh();};
  inp.addEventListener('change',done);inp.addEventListener('blur',done);
}

function addSub(id){

// ── 세부 삭제 ──
function delSub(id,idx){
  const t=tasks.find(x=>x.id===id);if(!t||!t.subtasks)return;
  t.subtasks.splice(idx,1);
  const cnt=t.subtasks.filter(s=>s.done).length;
  if(!t.subtasks.length)t.status='예정';
  else if(cnt===t.subtasks.length)t.status='완료';
  else if(cnt>0)t.status='진행중';
  else t.status='예정';
  saveLocal();fbPut(t);refresh();
}

// ── 달력 ──
function renderCal(mode){
  const Y=mode==='s'?sCY:tCY,M=mode==='s'?sCM:tCM,sel=mode==='s'?sCS:tCS;
  document.getElementById(mode+'CT').textContent=Y+'년 '+(M+1)+'월';
  const fd=new Date(Y,M,1).getDay(),ld=new Date(Y,M+1,0).getDate(),td=new Date();
  let h=DKO.map(d=>'<div class="cdow">'+d+'</div>').join('');
  const pl=new Date(Y,M,0).getDate();
  for(let i=fd-1;i>=0;i--)h+='<div class="cday other"><div class="dnum">'+(pl-i)+'</div></div>';
  for(let d=1;d<=ld;d++){
    const ds=Y+'-'+String(M+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const iT=d===td.getDate()&&M===td.getMonth()&&Y===td.getFullYear();
    const iS=sel===ds;
    const dt=tasks.filter(t=>t.deadline===ds||t.date===ds);
    const dots=[...new Set(dt.map(t=>dc(t.dept)))].slice(0,4);
    h+='<div class="cday'+(iT?' today':'')+(iS?' sel':'')+'" data-cal="'+mode+'" data-date="'+ds+'"><div class="dnum">'+d+'</div><div class="ddots">'+dots.map(c=>'<div class="ddot" style="background:'+c+'"></div>').join('')+'</div></div>';
  }
  const rem=(fd+ld)%7===0?0:7-(fd+ld)%7;
  for(let d=1;d<=rem;d++)h+='<div class="cday other"><div class="dnum">'+d+'</div></div>';
  document.getElementById(mode+'CG').innerHTML=h;
  renderCalDet(mode);
}
function renderCalDet(mode){
  const sel=mode==='s'?sCS:tCS;
  const det=document.getElementById(mode+'CD');
  if(!sel){det.innerHTML='';return;}
  const dt=tasks.filter(t=>t.deadline===sel||t.date===sel);
  if(!dt.length){det.innerHTML='<div class="cdet"><div class="cdet-d">'+fD(sel)+'</div><div style="font-size:13px;color:var(--text3)">업무 없음</div></div>';return;}
  det.innerHTML='<div class="cdet"><div class="cdet-d">'+fD(sel)+' — '+dt.length+'개</div>'+dt.map(t=>'<div class="ctr"><div class="cbar" style="background:'+dc(t.dept)+'"></div><div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:3px">'+t.title+'</div><div style="font-size:11px;color:var(--text2)">'+(t.assignees||[t.assignee]).join(', ')+' · '+t.dept+'</div></div><span class="tag tag-'+t.status+'">'+t.status+'</span></div>').join('')+'</div>';
}

// ── 부서 현황 ──
function deptHtml(teacher){
  return DEPTS.map(dept=>{
    const dt=tasks.filter(t=>t.dept===dept);
    const done=dt.filter(t=>t.status==='완료').length;
    const pct=dt.length>0?Math.round(done/dt.length*100):0;
    const col=dc(dept);
    const active=dt.filter(t=>t.status!=='완료');
    const doneL=dt.filter(t=>t.status==='완료');
    const opts=teacher?{showEB:true,showDel:true}:{};
    return '<div class="ds"><div class="dh"><span class="db db-'+dept+'">'+dept+'</span><span style="font-size:12px;color:'+col+';font-family:\'Space Mono\',monospace;font-weight:700">'+done+'/'+dt.length+' ('+pct+'%)</span></div><div class="dp"><div class="dpf" style="width:'+pct+'%;background:'+col+'"></div></div>'+(active.length?active.map(t=>card(t,opts)).join(''):'<div style="font-size:13px;color:var(--text3);padding:4px 0">진행 중 없음</div>')+doneSec(doneL,opts,dept+(teacher?'_t':'_s'))+'</div>';
  }).join('');
}
function renderSDept(){document.getElementById('sDept').innerHTML=deptHtml(false);}
function renderTDept(){document.getElementById('tDept').innerHTML=deptHtml(true);}

// ── 교사 대시보드 ──
function renderDash(){
  const total=tasks.length,done=tasks.filter(t=>t.status==='완료').length,ing=tasks.filter(t=>t.status==='진행중').length;
  const urg=tasks.filter(t=>{const d=dU(t.deadline);return d!==null&&d<=3&&t.status!=='완료';}).length;
  document.getElementById('stT').textContent=total;
  document.getElementById('stD').textContent=done;
  document.getElementById('stI').textContent=ing;
  document.getElementById('stU').textContent=urg;
  const ua=tasks.filter(t=>isUA(t)&&t.status!=='완료');
  document.getElementById('uaArea').innerHTML=ua.length===0?'<div style="font-size:13px;color:var(--text3);padding:8px 0">미배정 없음 ✅</div>':ua.map(t=>'<div class="ua"><div class="ua-top"><div class="ua-ti">'+t.title+'</div><div class="ua-btns"><button type="button" class="eb" data-action="edit" data-id="'+t.id+'">✏️</button><button type="button" class="abtn" data-action="assign" data-id="'+t.id+'">배정</button></div></div><div class="tc-meta">'+(t.category?'<span class="db db-'+t.dept+'">'+t.category+'</span>':'')+'<span class="db db-'+t.dept+'">'+t.dept+'</span>'+(t.deadline?'<span style="font-size:11px;color:var(--text2)">⏰ '+fD(t.deadline)+'</span>':'')+'</div></div>').join('');
  const ul=tasks.filter(t=>{const d=dU(t.deadline);return d!==null&&d<=3&&t.status!=='완료';}).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  document.getElementById('urgArea').innerHTML=ul.length===0?'<div style="font-size:13px;color:var(--text3);padding:8px 0">마감 임박 없음 ✅</div>':ul.map(t=>card(t,{showEB:true})).join('');
  const now=new Date();now.setHours(0,0,0,0);const wk=new Date(now);wk.setDate(wk.getDate()-7);
  const recent=tasks.filter(t=>t.status==='완료'&&t.completedAt&&new Date(t.completedAt)>=wk).sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt)).slice(0,15);
  const todayL=recent.filter(t=>new Date(t.completedAt)>=now);
  const wkL=recent.filter(t=>new Date(t.completedAt)<now);
  function feedFn(list){
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px 16px;margin-bottom:8px;box-shadow:var(--sh)">'+list.map(t=>{
      const a=t.assignees||[t.assignee].filter(Boolean);const col=dc(t.dept);
      const diff=t.completedAt?Math.floor((new Date()-new Date(t.completedAt))/60000):0;
      const ts=diff<1?'방금':diff<60?diff+'분 전':diff<1440?Math.floor(diff/60)+'시간 전':Math.floor(diff/1440)+'일 전';
      return '<div class="feed-item"><div class="feed-av" style="background:'+col+'22;color:'+col+'">'+(a[0]||'?').slice(-1)+'</div><div class="feed-info"><div class="feed-nm">'+a.join(', ')+' <span class="db db-'+t.dept+'" style="font-size:10px">'+t.dept+'</span></div><div class="feed-tk">'+t.title+'</div></div><div class="feed-tm">'+ts+'</div></div>';
    }).join('')+'</div>';
  }
  let fh='';
  if(todayL.length)fh+='<div style="font-size:11px;color:var(--accent3);font-weight:700;font-family:\'Space Mono\',monospace;margin-bottom:8px">TODAY ('+todayL.length+')</div>'+feedFn(todayL);
  if(wkL.length)fh+='<div style="font-size:11px;color:var(--text2);font-weight:700;font-family:\'Space Mono\',monospace;margin:12px 0 8px">이번 주 ('+wkL.length+')</div>'+feedFn(wkL);
  document.getElementById('feedArea').innerHTML=fh||'<div style="font-size:13px;color:var(--text3);padding:8px 0">이번 주 완료 없음</div>';
  document.getElementById('dSum').innerHTML=DEPTS.map(dept=>{
    const dt=tasks.filter(t=>t.dept===dept);const d=dt.filter(t=>t.status==='완료').length;
    const pct=dt.length>0?Math.round(d/dt.length*100):0;const col=dc(dept);
    return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="db db-'+dept+'">'+dept+'</span><span style="font-size:12px;color:'+col+';font-family:\'Space Mono\',monospace;font-weight:600">'+d+'/'+dt.length+' '+pct+'%</span></div><div class="dp"><div class="dpf" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }).join('');
}

// ── 교사: 학생별 ──
function renderTStu(){
  document.getElementById('tStu').innerHTML='<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px 16px;box-shadow:var(--sh)">'+MEMBERS.map(m=>{
    const mt=tasks.filter(t=>(t.assignees||[t.assignee]).includes(m.name));
    const done=mt.filter(t=>t.status==='완료').length;const pct=mt.length>0?Math.round(done/mt.length*100):0;const col=dc(m.dept);
    return '<div class="sr" data-action="openStu" data-name="'+m.name+'"><div class="sav" style="background:'+col+'22;color:'+col+'">'+m.name.slice(-1)+'</div><div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:3px">'+m.name+'</div><span class="db db-'+m.dept+'">'+m.dept+'</span></div><div style="text-align:right"><div style="font-size:12px;color:var(--text2)">'+done+'/'+mt.length+'</div><div class="mb"><div class="mf" style="width:'+pct+'%;background:'+col+'"></div></div></div></div>';
  }).join('')+'</div>';
}
function openStu(name){
  const mt=tasks.filter(t=>(t.assignees||[t.assignee]).includes(name));
  const m=gm(name);
  document.getElementById('stuTitle').textContent=name+' ('+m.dept+') 업무 현황';
  const opts={showEB:true,showSB:true,showDel:true};
  document.getElementById('stuBody').innerHTML=renderGrp(mt.filter(t=>t.status!=='완료'),opts)+doneSec(mt.filter(t=>t.status==='완료'),opts,'stu_'+name);
  document.getElementById('stuMov').classList.add('open');
}

// ── 교사: 전체 업무 ──
function renderAllTasks(){
  let list=allFilt==='전체'?[...tasks]:tasks.filter(t=>t.status===allFilt);
  if(sq){const q=sq.toLowerCase();list=list.filter(t=>(t.title||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q)||((t.assignees||[t.assignee]).join(' ')).toLowerCase().includes(q)||(t.dept||'').toLowerCase().includes(q));}
  list.sort((a,b)=>{if(a.status==='완료'&&b.status!=='완료')return 1;if(a.status!=='완료'&&b.status==='완료')return -1;if(!a.deadline)return 1;if(!b.deadline)return -1;return new Date(a.deadline)-new Date(b.deadline);});
  const opts={showEB:true,showDel:true};
  const active=list.filter(t=>t.status!=='완료');const done=list.filter(t=>t.status==='완료');
  const area=document.getElementById('allArea');
  if(!list.length){area.innerHTML='<div class="empty"><div class="ei">🔍</div><p>검색 결과가 없어요</p></div>';return;}
  area.innerHTML=(active.length?active.map(t=>card(t,opts)).join(''):'')+doneSec(done,opts,'all');
}

// ── refresh ──
function refresh(){
  const s0=document.getElementById('s0Name');
  const s2=document.getElementById('s2Name');
  renderUnNotice();
  if(s0&&s0.value)renderMyTasks();
  if(s2&&s2.value)renderManage();
  renderSDept();
  if(document.getElementById('tView').style.display!=='none'){renderDash();renderTDept();renderTStu();renderAllTasks();}
}
function openDones(){
  ['my','man','all'].forEach(id=>{
    const dt=document.querySelector('[data-done="'+id+'"]');
    const dl=document.getElementById('dl-'+id);
    if(dt&&dl&&!dt.classList.contains('open')){dt.classList.add('open');dl.classList.add('open');}
  });
}

// ── 이벤트 바인딩 ──
function bindStatic(){
  // 모드 카드
  document.getElementById('btnS').addEventListener('click',enterStudent);
  document.getElementById('btnT').addEventListener('click',showPw);
  // 비밀번호
  document.getElementById('pwOK').addEventListener('click',checkPw);
  document.getElementById('pwBack').addEventListener('click',goHome);
  document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});
  // 뒤로/잠금
  document.getElementById('sBack').addEventListener('click',goHome);
  document.getElementById('tBack').addEventListener('click',goHome);
  document.getElementById('lockBtn').addEventListener('click',goHome);
  // 업무 등록
  document.getElementById('submitBtn').addEventListener('click',submitTask);
  document.getElementById('addSubBtn').addEventListener('click',addSubRow);
  // 편집 모달
  document.getElementById('editSave').addEventListener('click',saveEdit);
  document.getElementById('editCancel').addEventListener('click',()=>closeMov('editMov'));
  document.getElementById('mAssigneeToggle').addEventListener('click',()=>{
    const p=document.getElementById('mAssigneePanel');
    const open=p.style.display!=='none';
    p.style.display=open?'none':'block';
    document.getElementById('mAssigneeArrow').textContent=open?'변경하기 ▼':'접기 ▲';
  });
  document.querySelectorAll('#mStBtns .sb-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      _editStatus=btn.dataset.status;
      document.querySelectorAll('#mStBtns .sb-btn').forEach(b=>b.className='sb-btn'+(b.dataset.status===_editStatus?' a-'+_editStatus:''));
    });
  });
  // 배정 모달
  document.getElementById('assignSave').addEventListener('click',saveAssign);
  document.getElementById('assignCancel').addEventListener('click',()=>closeMov('assignMov'));
  // 학생 모달
  document.getElementById('stuClose').addEventListener('click',()=>closeMov('stuMov'));
  // 삭제 모달
  document.getElementById('delOK').addEventListener('click',confirmDel);
  document.getElementById('delCancel').addEventListener('click',()=>closeMov('delMov'));
  // 달력 네비
  document.getElementById('sCP').addEventListener('click',()=>{sCM--;if(sCM<0){sCM=11;sCY--;}renderCal('s');});
  document.getElementById('sCN').addEventListener('click',()=>{sCM++;if(sCM>11){sCM=0;sCY++;}renderCal('s');});
  document.getElementById('tCP').addEventListener('click',()=>{tCM--;if(tCM<0){tCM=11;tCY--;}renderCal('t');});
  document.getElementById('tCN').addEventListener('click',()=>{tCM++;if(tCM>11){tCM=0;tCY++;}renderCal('t');});
  // 탭
  document.querySelectorAll('#sTnav .ti').forEach(ti=>ti.addEventListener('click',()=>swTab('sTnav',['sP0','sP1','sP2','sP3','sP4'],parseInt(ti.dataset.tab),sFns)));
  document.querySelectorAll('#tTnav .ti').forEach(ti=>ti.addEventListener('click',()=>swTab('tTnav',['tP0','tP1','tP2','tP3','tP4'],parseInt(ti.dataset.tab),tFns)));
  // 필터
  document.querySelectorAll('#filterBar .fc').forEach(fc=>fc.addEventListener('click',()=>{allFilt=fc.dataset.filter;document.querySelectorAll('#filterBar .fc').forEach(c=>c.classList.toggle('active',c===fc));renderAllTasks();}));
  // 검색
  const si=document.getElementById('searchInput');
  const sc=document.getElementById('searchClear');
  if(si)si.addEventListener('input',()=>{sq=si.value.trim();renderAllTasks();});
  if(sc)sc.addEventListener('click',()=>{sq='';if(si)si.value='';renderAllTasks();});
  // 모달 배경 닫기
  document.querySelectorAll('.mov').forEach(mov=>{
    mov.addEventListener('click',e=>{if(e.target.classList.contains('mov'))closeMov(mov.id);});
  });
  // 모달 내부 클릭 전파 차단
  document.querySelectorAll('.ms').forEach(ms=>ms.addEventListener('click',e=>e.stopPropagation()));
}

// ── 동적 이벤트 위임 ──
document.addEventListener('click',function(e){
  // 완료 토글
  const dt=e.target.closest('[data-done]');
  if(dt){const id=dt.dataset.done;dt.classList.toggle('open');const dl=document.getElementById('dl-'+id);if(dl)dl.classList.toggle('open');return;}
  // 달력 날짜
  const cday=e.target.closest('.cday[data-date]');
  if(cday){const mode=cday.dataset.cal,date=cday.dataset.date;if(mode==='s'){sCS=sCS===date?null:date;renderCal('s');}else{tCS=tCS===date?null:date;renderCal('t');}return;}
  // data-action
  const el=e.target.closest('[data-action]');if(!el)return;
  const action=el.dataset.action,id=el.dataset.id,idx=el.dataset.idx!==undefined?parseInt(el.dataset.idx):undefined;
  if(action==='edit'){openEdit(id);return;}
  if(action==='del'){openDel(id);return;}
  if(action==='chgSt'){chgSt(id,el.dataset.status);return;}
  if(action==='togSub'){togSub(id,idx);return;}
  if(action==='editSD'){editSD(id,idx);return;}
  if(action==='addSub'){addSub(id);return;}
  if(action==='delSub'){delSub(id,idx);return;}
  if(action==='assign'){openAssign(id);return;}
  if(action==='openStu'){openStu(el.dataset.name);return;}
  if(action==='selfAssign'){selfAssign(id);return;}
  if(action==='rmSub'){if(document.querySelectorAll('.sir').length<=1){toast('최소 1개 필요');return;}el.closest('.sir').remove();return;}
});

// 이름 change
document.addEventListener('change',function(e){
  if(['s0Name','s1Name','s2Name'].includes(e.target.id)){
    const name=e.target.value;
    ['s0Name','s1Name','s2Name'].forEach(id=>{const el=document.getElementById(id);if(el&&el.value!==name)el.value=name;});
    buildCWList(name);
    if(e.target.id==='s0Name')renderMyTasks();
    if(e.target.id==='s2Name')renderManage();
  }
});

// ── 시작 ──
initTasks();
fillAllSels();
buildCWList('');
bindStatic();
</script>
